<style>
  /* ====== Ventana emergente de la imagen ====== */
  #imageModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(2, 8, 16, 0.88);
    backdrop-filter: blur(6px);
    overflow-y: auto;
  }
  #imageModal.active { display: flex; }

  #imageModal .modal-content {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    width: min(1000px, 100%);
    max-height: 90vh;
    background: #0b1622;
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-radius: 18px;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  #imageModal .modal-image-container {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    min-height: 280px;
  }
  #imageModal .modal-image-container img {
    width: 100%;
    height: 100%;
    max-height: 90vh;
    object-fit: contain;
    display: block;
  }

  #imageModal .modal-information {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 56px 28px 28px;
    overflow-y: auto;
  }
  #imageModal .modal-category {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--cyan, #22d3ee);
  }
  #imageModal .modal-information h2 { margin: 0; font-size: 26px; }
  #imageModal .modal-information p { margin: 0; line-height: 1.6; opacity: 0.85; }
  #imageModal .modal-data {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 14px;
  }
  #imageModal .modal-footer {
    margin-top: auto;
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.5;
  }

  /* ====== Botón X ====== */
  #imageModal .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 2;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 0 4px;
    font-size: 30px;
    line-height: 1;
    color: #fff;
    background: rgba(11, 22, 34, 0.85);
    border: 2px solid var(--cyan, #22d3ee);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s;
  }
  #imageModal .modal-close:hover {
    background: var(--cyan, #22d3ee);
    color: #04141c;
    transform: rotate(90deg);
  }
  #imageModal .modal-close:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  /* ====== Celular / pantallas angostas ====== */
  @media (max-width: 760px) {
    #imageModal { padding: 12px; align-items: flex-start; }
    #imageModal .modal-content {
      grid-template-columns: 1fr;
      max-height: none;
    }
    #imageModal .modal-image-container { min-height: 220px; }
    #imageModal .modal-information { padding: 20px; }
  }
</style>
